<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pink Crow Café Franchise Terminal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<div class="pos-container">
    <div class="brand-header">
        <div class="brand-logo-cell">
            <img class="brand-logo" src="/logo.png" alt="Pink Crow Logo">
        </div>
        <div class="brand-text-cell">
            <h2>Pink Crow Café</h2>
            <div class="subtitle">Franchise Node POS Client</div>
        </div>
    </div>

    
    <!-- Tab Navigation Controllers -->
    <div class="tab-navigation">
        <button class="tab-btn active" onclick="switchTab('checkout-tab')">Checkout Panel</button>
        <button class="tab-btn" onclick="switchTab('dashboard-tab')">Visual Menu Menu</button>
    </div>
    
    <!-- TAB 1: CHECKOUT PANEL FORM -->
    <div id="checkout-tab" class="tab-content active-content">
        <form id="pos-form">
            <div class="form-group"><label>Ticket ID</label><input type="number" id="order_id" required value="1001"></div>
            <div class="form-group">
                <label>Menu Item</label>
                <select id="item_name" onchange="updateModifierPricing()">
                    <!-- Populated dynamically via server connection -->
                </select>
            </div>
            <div class="form-group">
                <label>Modifier</label>
                <select id="modifier">
                    <option value="None">None (+$0.00)</option>
                    <option value="Add Protein">Add Protein (+$1.75)</option>
                    <option value="Add PB">Add PB (+$1.00)</option>
                </select>
            </div>
            <div class="form-group"><label>Quantity</label><input type="number" id="qty" min="1" value="1" required></div>
            <div class="form-group">
                <label>Payment Tender</label>
                <select id="payment_method">
                    <option value="Card">Card</option><option value="Cash">Cash</option><option value="Mobile">Mobile</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-submit">Submit Order</button>
        </form>
        
        <div class="action-grid">
            <button type="button" class="btn btn-action" id="btn-print">Print Receipt</button>
            <button type="button" class="btn btn-action" id="btn-report">Generate Report</button>
        </div>
    </div>

    <!-- TAB 2: LIVE VISUAL DASHBOARD GRID -->
    <div id="dashboard-tab" class="tab-content">
        <!-- Dynamic Category Filter Track Bar -->
        <div id="category-filter-bar" class="filter-pill-row">
            <!-- Generated dynamically via javascript connection mapping -->
        </div>
        
        <div id="visual-menu-grid" class="menu-grid">
            <!-- Cartoon Item Cards Generated Dynamically from CSV -->
        </div>
    </div>

    
    <div id="status" class="status-msg"></div>
</div>

<!-- INVISIBLE THERMAL RECEIPT ZONE -->
<div id="receipt-print-zone">
    <div class="receipt-center">
        <img class="receipt-logo" src="/logo.png">
        <h3>%NBSP;PINK CROW CAFÉ</h3>
        <p class="subtitle" style="color:#000000;">Franchise Receipt</p>
    </div>
    <div class="receipt-line"></div>
    <div class="receipt-flex"><span>Date:</span><span id="r-date"></span></div>
    <div class="receipt-flex"><span>Ticket ID:</span><span id="r-ticket"></span></div>
    <div class="receipt-flex"><span>Tender:</span><span id="r-tender"></span></div>
    <div class="receipt-line"></div>
    <div class="receipt-flex"><span id="r-item"></span><span id="r-qty"></span></div>
    <div id="r-mod-line" class="receipt-flex" style="padding-left:10px; font-size:11px;"></div>
    <div class="receipt-line"></div>
    <div class="receipt-flex" style="font-weight:bold;"><span>TOTAL:</span><span id="r-total"></span></div>
    <div class="receipt-line"></div>
    <p class="receipt-center" style="font-size:10px;">Thank you for your business!</p>
</div>

<script src="{{ url_for('static', filename='js/terminal.js') }}"></script>
</body>
</html>
